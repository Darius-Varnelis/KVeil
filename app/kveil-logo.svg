<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#171e38"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.32" cy="0.24" r="0.62">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="0.78" cy="0.80" r="0.58">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="veilBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="veilFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="veilEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="lockFill" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="lockStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="keyholeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- Base dark glass squircle (no clipPath needed for QtSvg compatibility) -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#glowCyan)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#glowIndigo)"/>

  <!-- Layered translucent veil waves clipped mathematically to squircle corners -->
  <path d="M 32 238 C 155 305, 315 190, 480 250 L 480 376 A 104 104 0 0 1 376 480 L 136 480 A 104 104 0 0 1 32 376 Z"
        fill="url(#veilBack)"/>
  <path d="M 32 332 C 145 235, 290 315, 480 182 L 480 376 A 104 104 0 0 1 376 480 L 136 480 A 104 104 0 0 1 32 376 Z"
        fill="url(#veilFront)"/>
  <path d="M 32 332 C 145 235, 290 315, 480 182"
        fill="none" stroke="url(#veilEdge)" stroke-width="2.5"/>

  <!-- Padlock shackle ending cleanly at the top edge of the glass body -->
  <path d="M 200 223 V 180 A 56 56 0 0 1 312 180 V 223"
        fill="none" stroke="url(#shackleGrad)" stroke-width="26" stroke-linecap="butt"/>

  <!-- Frosted glass lock body -->
  <rect x="148" y="222" width="216" height="170" rx="40" ry="40"
        fill="url(#lockFill)" stroke="url(#lockStroke)" stroke-width="3"/>

  <!-- Minimal symmetric keyhole -->
  <path d="M 267 306.25 A 18 18 0 1 0 245 306.25 L 245 333 A 11 11 0 0 0 267 333 Z"
        fill="url(#keyholeGrad)"/>

  <!-- Subtle outer glass rim -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103"
        fill="none" stroke="url(#rimGrad)" stroke-width="2"/>
</svg>
